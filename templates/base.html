<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4" style="position:sticky;top:0;z-index: 1000;">
        <a class="navbar-brand" href="{% url 'home' %}">Bloc-Notes</a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <span class="text-white me-3">Bonjour, {{ user.username }}</span>
                <a class="btn btn-outline-light" href="{% url 'ajouter-note' %}">Ajouter</a>
                <a class="btn btn-outline-light" href="{% url 'logout-user' %}">Déconnexion</a>
            {% else %}
                <a class="btn btn-outline-light me-2" href="{% url 'login-user' %}">Connecter</a>
                <a class="btn btn-light" href="{% url 'sign-user' %}">Inscription</a>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
    <!-- Bootstrap JS (optionnel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <footer>
        <hr>
        <p>&copy; 2025 - Bloc-notes</p>
    </footer>
</body>
</html>
